name: AAPS CI

on:
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Select AAPS Version'
        required: true
        default: '3.4.2.6'
        type: choice
        options:
          # ── 3.4.x (JDK 21) ──────────────────────────────
          #
          - 3.4.2.6
          - 3.4.2.4
          - 3.4.2.3
          - 3.4.2.2
          - 3.4.2.1
          - 3.4.2.0
          - 3.4.1.0
          - 3.4.0.0
          # ── 3.3.x (JDK 21) ──────────────────────────────
          - 3.3.2.1
          - 3.3.2.0
          - 3.3.1.3
          # ── 3.2.x (JDK 17) ──────────────────────────────
          - 3.2.0.4
          - 3.2.0.3
          - 3.2.0.2
          - 3.2.0.1
          - 3.2.0.0
          # ── 3.1.x (JDK 17) ──────────────────────────────
          - 3.1.0.3
          - 3.1.0.2
          - 3.1.0.1
          - 3.1.0
          # ── 3.0.x (JDK 11) ──────────────────────────────
          - 3.0.0.2
          - 3.0.0.1
          - 3.0.0
      buildVariant:
        description: 'Select Build Variant'
        required: true
        default: 'fullRelease'
        type: choice
        options:
          - fullRelease
          - fullDebug
          - aapsclientRelease
          - aapsclientDebug
          - aapsclient2Release
          - aapsclient2Debug
          - pumpcontrolRelease
          - pumpcontrolDebug

jobs:
  build:
    name: Build AAPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code at tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch selected tag from upstream
        run: |
          git remote add upstream https://github.com/nightscout/AndroidAPS.git || true
          git fetch upstream refs/tags/${{ github.event.inputs.tagName }}:refs/tags/${{ github.event.inputs.tagName }}
          echo "✅ Tag ${{ github.event.inputs.tagName }} fetched from upstream."

      - name: Determine JVM version from tag
        run: |
          TAG="${{ github.event.inputs.tagName }}"
          JAVA_VERSION=$(jq -r '.default' .github/jdk-map.json)
          while IFS=$'\t' read -r pattern jdk; do
            if [[ "$TAG" == $pattern ]]; then
              JAVA_VERSION="$jdk"
              break
            fi
          done < <(jq -r '.mappings[] | "\(.pattern)\t\(.jdk)"' .github/jdk-map.json)
          echo "JAVA_VERSION=$JAVA_VERSION" >> $GITHUB_ENV
          echo "ℹ️ Tag $TAG → JDK $JAVA_VERSION (from jdk-map.json)"

      - name: Switch to selected tag
        run: |
          git checkout refs/tags/${{ github.event.inputs.tagName }}
          echo "✅ Checked out tag ${{ github.event.inputs.tagName }}"

      - name: Patch for Android 16 (Remove sharedUserId)
        run: |
          echo "🛠️ Removing sharedUserId for Android 16 compatibility..."
          find . -name "AndroidManifest.xml" -exec sed -i 's/android:sharedUserId="[^"]*"//g' {} +
          git config user.email "actions@github.com"
          git config user.name "Actions"
          git add .
          git commit -m "Patch for Android 16" || true
          echo "✅ Android 16 patch applied."

      - name: Set BUILD_VARIANT
        run: |
          BUILD_VARIANT="${{ github.event.inputs.buildVariant }}"
          echo "BUILD_VARIANT=$BUILD_VARIANT" >> $GITHUB_ENV
          VARIANT_FLAVOR=$(echo "$BUILD_VARIANT" | sed -E 's/(Release|Debug)$//' | tr '[:upper:]' '[:lower:]')
          VARIANT_TYPE=$(echo "$BUILD_VARIANT" | grep -oE '(Release|Debug)$' | tr '[:upper:]' '[:lower:]')
          echo "VARIANT_FLAVOR=$VARIANT_FLAVOR" >> $GITHUB_ENV
          echo "VARIANT_TYPE=$VARIANT_TYPE" >> $GITHUB_ENV
          VERSION_SUFFIX=""
          if [[ "$VARIANT_FLAVOR" != "full" ]]; then VERSION_SUFFIX="$VARIANT_FLAVOR"; fi
          if [[ "$VARIANT_TYPE" == "debug" ]]; then VERSION_SUFFIX="$VERSION_SUFFIX-debug"; fi
          if [[ -n "$VERSION_SUFFIX" && "$VERSION_SUFFIX" != -* ]]; then VERSION_SUFFIX="-$VERSION_SUFFIX"; fi
          echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> $GITHUB_ENV

      - name: Extract VERSION
        run: |
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          if echo "$BRANCH_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            VERSION="$BRANCH_NAME"
          else
            VERSION=$(grep 'val appVersion' buildSrc/src/main/kotlin/Versions.kt | awk -F '"' '{print $2}')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore file
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/keystore/keystore.jks"

      - name: Build APKs
        run: |
            ./gradlew :app:assemble${{ env.BUILD_VARIANT }} :wear:assemble${{ env.BUILD_VARIANT }} \
              -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC -Xss1024m" \
              -Dkotlin.daemon.jvm.options="-Xmx2g" \
              -Dkotlin.compiler.execution.strategy="in-process" \
              -Dorg.gradle.daemon=true \
              -Dorg.gradle.workers.max=8 \
              -Dorg.gradle.caching=true \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/keystore/keystore.jks" \
              -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}" \
              -PreleaseStoreFile="$RUNNER_TEMP/keystore/keystore.jks" \
              -PreleaseStorePassword="${{ secrets.KEYSTORE_PASSWORD }}" \
              -PreleaseKeyAlias="${{ secrets.KEY_ALIAS }}" \
              -PreleaseKeyPassword="${{ secrets.KEY_PASSWORD }}" \
              -PignoreUncommittedChanges=true

      - name: Rename APKs with version
        run: |
          mv app/build/outputs/apk/${{ env.VARIANT_FLAVOR }}/${{ env.VARIANT_TYPE }}/*.apk aaps-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}.apk
          mv wear/build/outputs/apk/${{ env.VARIANT_FLAVOR }}/${{ env.VARIANT_TYPE }}/*.apk aaps-wear-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}.apk

      - name: Upload APKs to Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AAPS-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}-APKs
          path: |
            aaps-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}.apk
            aaps-wear-${{ env.VERSION }}${{ env.VERSION_SUFFIX }}.apk
          retention-days: 14

  cleanup:
    name: Cleanup Old Workflow Runs
    needs: build
    if: always()
    permissions:
      actions: write
    uses: ./.github/workflows/cleanup-workflow-runs.yml
    with:
      workflow_name: 'AAPS CI'
      keep_runs: 20
      keep_threshold: 5
